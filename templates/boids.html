{% extends "base.html" %}

{% block title %}Boids Simulation Framework{% endblock %}

{% block extra_head %}
<style>
    .canvas-container { display: flex; justify-content: center; }
    canvas { background-color: #0d1117; border: 1px solid #30363d; border-radius: 8px; }
    .slider-header { display: flex; justify-content: space-between; font-weight: 600; color: #c9d1d9; }
    .value-counter { color: #3b8ad4; font-weight: 700; }
</style>
{% endblock %}

{% block content %}
<div class="container my-4">
    <h1 class="text-center mb-4">Boids Swarm Simulation</h1>

    <div class="row g-4">
        <div class="col-lg-8 canvas-container">
            <canvas id="boidsCanvas" width="800" height="800"></canvas>
        </div>
        
        <div class="col-lg-4">
            <div class="p-3 border rounded bg-dark">
                <h3>Simulation Controls</h3>
                
                <div class="btn-group w-100 mb-3" role="group">
                    <button class="btn btn-outline-primary active" id="btnPython">Python Backend</button>
                    <button class="btn btn-outline-info" id="btnWasm">C (WebAssembly)</button>
                </div>

                <div class="mb-3">
                    <div class="slider-header"><span>Population</span><span id="boidCountVal" class="value-counter">50</span></div>
                    <input type="range" class="form-range" id="boidCountSlider" min="5" max="150" step="1" value="50">
                </div>
                
                <div class="mb-3">
                    <div class="slider-header"><span>Cohesion</span><span id="cohesionVal" class="value-counter">0.134</span></div>
                    <input type="range" class="form-range" id="cohesionSlider" min="0" max="0.5" step="0.001" value="0.134">
                </div>
                
                <div class="mb-3">
                    <div class="slider-header"><span>Separation</span><span id="separationVal" class="value-counter">0.045</span></div>
                    <input type="range" class="form-range" id="separationSlider" min="0" max="0.1" step="0.001" value="0.045">
                </div>
                
                <div class="mb-3">
                    <div class="slider-header"><span>Alignment</span><span id="alignmentVal" class="value-counter">0.038</span></div>
                    <input type="range" class="form-range" id="alignmentSlider" min="0" max="0.1" step="0.001" value="0.038">
                </div>

                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="toggleCenters">
                    <label class="form-check-label text-light" for="toggleCenters">Show Group Centers</label>
                </div>

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="toggleLearning">
                    <label class="form-check-label text-success" for="toggleLearning">Enable Bandit RL</label>
                </div>

                <button class="btn btn-primary w-100" id="runBtn">Restart Simulation</button>
            </div>
        </div>
    </div>
</div>

<script src="/assets/boids_wasm.js"></script>

<script>
    const canvas = document.getElementById("boidsCanvas");
    const ctx = canvas.getContext("2d");
    const PYTHON_MAP_SIZE = 25.0;
    const BOID_STRUCT_SIZE = 20;

    let engineMode = "python";
    let pythonFrames = [];
    let pythonFrameIndex = 0;
    let wasmInitialized = false;

    let initSimulation, stepSimulation, getBoidsBuffer;

    const ENGINE_CONFIGS = {
        wasm: {
            cohesion:   { min: "0", max: "2.0", step: "0.01", value: "0.50" },
            separation: { min: "0", max: "300.0", step: "1.0", value: "150.0" },
            alignment:  { min: "0", max: "5.0", step: "0.05", value: "1.50" }
        },
        python: {
            cohesion:   { min: "0", max: "0.500", step: "0.001", value: "0.134" },
            separation: { min: "0", max: "0.100", step: "0.001", value: "0.045" },
            alignment:  { min: "0", max: "0.100", step: "0.001", value: "0.038" }
        }
    };

    // UI Elements
    const cohesionSlider = document.getElementById("cohesionSlider");
    const separationSlider = document.getElementById("separationSlider");
    const alignmentSlider = document.getElementById("alignmentSlider");
    const boidCountSlider = document.getElementById("boidCountSlider");

    const cohesionValEl = document.getElementById("cohesionVal");
    const separationValEl = document.getElementById("separationVal");
    const alignmentValEl = document.getElementById("alignmentVal");
    const boidCountValEl = document.getElementById("boidCountVal");

    // Slider Listeners
    boidCountSlider.oninput = (e) => boidCountValEl.textContent = e.target.value;
    cohesionSlider.oninput = (e) => cohesionValEl.textContent = e.target.value;
    separationSlider.oninput = (e) => separationValEl.textContent = e.target.value;
    alignmentSlider.oninput = (e) => alignmentValEl.textContent = e.target.value;

    function applyEngineConfig(mode) {
        const cfg = ENGINE_CONFIGS[mode];
        
        cohesionSlider.min = cfg.cohesion.min; cohesionSlider.max = cfg.cohesion.max; cohesionSlider.step = cfg.cohesion.step; cohesionSlider.value = cfg.cohesion.value;
        cohesionValEl.textContent = cfg.cohesion.value;

        separationSlider.min = cfg.separation.min; separationSlider.max = cfg.separation.max; separationSlider.step = cfg.separation.step; separationSlider.value = cfg.separation.value;
        separationValEl.textContent = cfg.separation.value;

        alignmentSlider.min = cfg.alignment.min; alignmentSlider.max = cfg.alignment.max; alignmentSlider.step = cfg.alignment.step; alignmentSlider.value = cfg.alignment.value;
        alignmentValEl.textContent = cfg.alignment.value;
    }

    document.getElementById("btnWasm").onclick = () => setEngineMode("wasm");
    document.getElementById("btnPython").onclick = () => setEngineMode("python");
    document.getElementById("runBtn").onclick = () => resetSimulation();

    function setEngineMode(mode) {
        if (engineMode === mode) return;
        engineMode = mode;
        applyEngineConfig(mode);

        document.getElementById("btnWasm").classList.toggle("active", mode === "wasm");
        document.getElementById("btnPython").classList.toggle("active", mode === "python");

        resetSimulation();
    }

    function resetSimulation() {
        const count = parseInt(boidCountSlider.value);
        if (engineMode === "wasm" && wasmInitialized) {
            initSimulation(count, canvas.width, canvas.height);
        } else if (engineMode === "python") {
            fetchPythonSimulation(true);
        }
    }

    async function fetchPythonSimulation(reset = false) {
        try {
            const response = await fetch("/api/boids/simulate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    cohesion: parseFloat(cohesionSlider.value),
                    separation: parseFloat(separationSlider.value),
                    alignment: parseFloat(alignmentSlider.value),
                    boid_count: parseInt(boidCountSlider.value),
                    reset: reset,
                    learning: document.getElementById("toggleLearning").checked
                })
            });
            const data = await response.json();
            if (data.status === "success") {
                pythonFrames = data.frames;
                pythonFrameIndex = 0;
            }
        } catch (err) {
            console.error("API Fetch Error:", err);
        }
    }

    // WASM Binding Initialization
    Module.onRuntimeInitialized = () => {
        initSimulation = Module.cwrap('init_simulation', null, ['number', 'number', 'number']);
        stepSimulation = Module.cwrap('step_simulation', null, ['number', 'number', 'number', 'number', 'number', 'number']);
        getBoidsBuffer = Module.cwrap('get_boids_buffer', 'number', []);

        wasmInitialized = true;
        resetSimulation();
        requestAnimationFrame(gameLoop);
    };

    let lastTime = performance.now();

    function gameLoop(currentTime) {
        let dt = Math.min((currentTime - lastTime) / 1000, 0.1);
        lastTime = currentTime;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const boidCount = parseInt(boidCountSlider.value);

        if (engineMode === "wasm" && wasmInitialized) {
            stepSimulation(
                parseFloat(separationSlider.value), 
                parseFloat(cohesionSlider.value), 
                parseFloat(alignmentSlider.value), 
                canvas.width, canvas.height, dt
            );

            const ptr = getBoidsBuffer();
            for (let i = 0; i < boidCount; i++) {
                let addr = ptr + (i * BOID_STRUCT_SIZE);
                let x = Module.getValue(addr, 'float');
                let y = Module.getValue(addr + 4, 'float');
                let vx = Module.getValue(addr + 8, 'float');
                let vy = Module.getValue(addr + 12, 'float');
                let isGrouped = Module.getValue(addr + 16, 'i8');

                if (!isNaN(x) && !isNaN(y)) {
                    drawTriangle(x, y, Math.atan2(vy, vx), isGrouped ? "#3b8ad4" : "#c9d1d9");
                }
            }
        } else if (engineMode === "python" && pythonFrames.length > 0) {
            const frame = pythonFrames[pythonFrameIndex];

            if (frame) {
                // Update sliders if RL Learning modified metrics
                if (document.getElementById("toggleLearning").checked && frame.metrics) {
                    cohesionSlider.value = frame.metrics.cohesion; cohesionValEl.textContent = frame.metrics.cohesion.toFixed(3);
                    separationSlider.value = frame.metrics.separation; separationValEl.textContent = frame.metrics.separation.toFixed(3);
                    alignmentSlider.value = frame.metrics.alignment; alignmentValEl.textContent = frame.metrics.alignment.toFixed(3);
                }

                // Render boids
                frame.boids.forEach(b => {
                    const x = (b.x / PYTHON_MAP_SIZE) * canvas.width;
                    const y = (b.y / PYTHON_MAP_SIZE) * canvas.height;
                    drawTriangle(x, y, b.angle, b.in_group ? "#3b8ad4" : "#c9d1d9");
                });

                // Render center points
                if (document.getElementById("toggleCenters").checked && frame.centers) {
                    ctx.fillStyle = "#ff5500";
                    frame.centers.forEach(c => {
                        ctx.beginPath();
                        ctx.arc((c.x / PYTHON_MAP_SIZE) * canvas.width, (c.y / PYTHON_MAP_SIZE) * canvas.height, 6, 0, 2 * Math.PI);
                        ctx.fill();
                    });
                }
            }

            // Cycle frame index or request new data when reaching the end
            if (pythonFrameIndex < pythonFrames.length - 1) {
                pythonFrameIndex++;
            } else {
                fetchPythonSimulation(false);
            }
        }

        requestAnimationFrame(gameLoop);
    }

    function drawTriangle(x, y, angle, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-6, -4);
        ctx.lineTo(-6, 4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
</script>
{% endblock %}
