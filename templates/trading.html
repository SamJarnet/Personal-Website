{% extends "base.html" %}

{% block title %}Trading Signal Bot{% endblock %}

{% block extra_head %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --td-bg: #0b0e14; --td-surf: #131720; --td-border: #262c36;
    --td-text: #e1e7ed; --td-sub: #768390;
    --td-green: #2da44e; --td-red: #f85149; --td-accent: #3971a5;
    --td-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --td-font-mono: "SF Mono", Consolas, Menlo, monospace;
  }
  #td-app { background: var(--td-bg); color: var(--td-text); font-family: var(--td-font-sans);
    font-size: 13px; min-height: calc(100vh - 60px); }
  #td-topbar { display:flex; align-items:center; gap:12px; padding:10px 16px;
    background: var(--td-surf); border-bottom:1px solid var(--td-border); }
  #td-ticker { background:var(--td-bg); color:var(--td-text); border:1px solid var(--td-border);
    padding:6px 10px; border-radius:3px; width:120px; font-family:var(--td-font-mono); }
  #td-search-btn, #td-bt-run { background:var(--td-accent); color:#fff; border:none;
    padding:6px 14px; border-radius:3px; cursor:pointer; font-weight:600; }
  #td-tabs { display:flex; border-bottom:1px solid var(--td-border); }
  .td-tab { background:none; border:none; color:var(--td-sub); padding:10px 18px;
    cursor:pointer; font-size:13px; border-bottom:2px solid transparent; }
  .td-tab.active { color:var(--td-text); border-bottom-color:var(--td-accent); }
  .td-panel { display:none; padding:16px; }
  .td-panel.active { display:block; }
  .td-co-hdr { margin-bottom:16px; }
  #td-co-name { font-size:18px; font-weight:700; }
  #td-co-sector { color:var(--td-sub); font-size:12px; }
  #td-co-price { font-size:22px; font-family:var(--td-font-mono); margin-right:8px; }
  .td-ctrl { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .td-pill { background:var(--td-surf); border:1px solid var(--td-border); color:var(--td-sub);
    padding:5px 12px; border-radius:14px; cursor:pointer; font-size:12px; }
  .td-pill.active { color:var(--td-text); border-color:var(--td-accent); }
  .td-chart-wrap { position:relative; height:380px; background:var(--td-surf);
    border:1px solid var(--td-border); border-radius:4px; padding:12px; }
  .td-params { background:var(--td-surf); border:1px solid var(--td-border); border-radius:4px;
    padding:14px; margin-bottom:12px; max-width:340px; }
  .td-prow { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .td-prow label { color:var(--td-sub); font-size:12px; }
  .td-prow input, .td-prow select { width:90px; background:var(--td-bg); color:var(--td-text);
    border:1px solid var(--td-border); border-radius:3px; padding:4px 6px; text-align:right; }
  .td-stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px; margin-top:14px; max-width:600px; }
  .td-stat-card { background:var(--td-surf); border:1px solid var(--td-border); border-radius:4px;
    padding:10px; }
  .td-stat-card .l { color:var(--td-sub); font-size:11px; text-transform:uppercase; }
  .td-stat-card .v { font-family:var(--td-font-mono); font-size:15px; margin-top:2px; }
  #td-status { color:var(--td-sub); font-size:12px; margin-left:auto; }
  .td-note { color:var(--td-sub); font-size:11px; margin-top:8px; max-width:600px; }
</style>
{% endblock %}

{% block content %}
<div id="td-app">
  <div id="td-topbar">
    <input id="td-ticker" type="text" value="AAPL" placeholder="TICKER"
           autocomplete="off" onkeydown="if(event.key==='Enter')tdSearch()"/>
    <button id="td-search-btn" onclick="tdSearch()">Load</button>
    <span id="td-status">Enter a ticker and press Load</span>
  </div>

  <div id="td-tabs">
    <button id="td-tab-btn-market" class="td-tab active" onclick="tdTab('market', this)">Market Data</button>
    <button id="td-tab-btn-backtest" class="td-tab" onclick="tdTab('backtest', this)">Signal Bot Backtest</button>
  </div>

  <!-- MARKET DATA -->
  <div id="td-market" class="td-panel active">
    <div class="td-co-hdr">
      <div id="td-co-name">—</div>
      <div id="td-co-sector"></div>
      <span id="td-co-price">—</span><span id="td-co-chg"></span>
    </div>
    <div class="td-ctrl">
      <span style="color:var(--td-sub);font-size:12px;margin-right:6px;">Period:</span>
      <button class="td-pill" onclick="tdPeriod('1M',this)">1M</button>
      <button class="td-pill" onclick="tdPeriod('3M',this)">3M</button>
      <button class="td-pill" onclick="tdPeriod('6M',this)">6M</button>
      <button class="td-pill active" onclick="tdPeriod('1Y',this)">1Y</button>
      <button class="td-pill" onclick="tdPeriod('2Y',this)">2Y</button>
      <button class="td-pill" onclick="tdPeriod('5Y',this)">5Y</button>
    </div>
    <div class="td-chart-wrap">
      <canvas id="td-mchart"></canvas>
    </div>
    <div class="td-stats-grid" id="td-stats"></div>
  </div>

  <!-- BACKTEST -->
  <div id="td-backtest" class="td-panel">
    <div class="td-params">
      <h4 style="margin-top:0;">SMA Crossover Strategy</h4>
      <div class="td-prow"><label>Starting Capital ($)</label><input id="p-cap" value="10000"/></div>
      <div class="td-prow"><label>Fast SMA (days)</label><input id="p-fast" value="20"/></div>
      <div class="td-prow"><label>Slow SMA (days)</label><input id="p-slow" value="50"/></div>
      <div class="td-prow"><label>Stop-loss MA (days)</label><input id="p-stop" value="150"/></div>
      <div class="td-prow"><label>Transaction Fee (%)</label><input id="p-fee" value="0.1"/></div>
      <div class="td-prow"><label>Dividend Yield (%)</label><input id="p-div" value="4.5"/></div>
      <div class="td-prow">
        <label>Period</label>
        <select id="p-period">
          <option>1Y</option><option selected>2Y</option><option>5Y</option><option>All</option>
        </select>
      </div>
      <button id="td-bt-run" onclick="tdRunBacktest()" style="width:100%;margin-top:6px;">Run Backtest</button>
      <div class="td-note">
        Engine stats calculated using main.py logic (Sharpe, Volatility, Max Drawdown).
      </div>
    </div>

    <div class="td-chart-wrap">
      <canvas id="td-bchart"></canvas>
    </div>
    <div class="td-stats-grid" id="td-bt-stats"></div>
  </div>

<script>
const TC = { text:'#e1e7ed', sub:'#768390', border:'#262c36', surf:'#131720',
             green:'#2da44e', red:'#f85149', accent:'#3971a5' };

let tdSym = null, tdPer = '1Y', tdMChart = null, tdBChart = null;

function tdEl(id){ return document.getElementById(id); }

function tdTab(name, el){
  document.querySelectorAll('.td-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.td-tab').forEach(b => b.classList.remove('active'));
  tdEl('td-' + name).classList.add('active');
  el.classList.add('active');
}

function tdPeriod(p, el){
  tdPer = p;
  document.querySelectorAll('#td-market .td-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  if (tdSym) tdFetchHistory(tdSym, tdPer);
}

function tdBaseChart(labels, datasets, yLabel=''){
  const step = Math.max(1, Math.floor(labels.length / 8));
  const sparse = labels.map((l,i) => i % step === 0 ? l.slice(0,7) : '');
  return {
    type: 'line',
    data: { labels: sparse, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode:'index', intersect:false },
      plugins: {
        legend: { labels: { color: TC.text, boxWidth:8, font:{size:10} } },
        tooltip: { backgroundColor: TC.surf, borderColor: TC.border, borderWidth:1,
          titleColor: TC.sub, bodyColor: TC.text }
      },
      scales: {
        x: { grid:{color:TC.border+'55'}, ticks:{color:TC.sub, maxRotation:0} },
        y: { grid:{color:TC.border+'55'}, ticks:{color:TC.sub},
             title:{ display: !!yLabel, text: yLabel, color: TC.sub } }
      }
    }
  };
}

async function tdSearch(){
  const sym = tdEl('td-ticker').value.trim().toUpperCase();
  if(!sym) return;
  tdSym = sym;
  tdEl('td-status').textContent = 'Loading…';
  try {
    const q = await fetch(`/api/trading/quote/${sym}`).then(r => { if(!r.ok) throw new Error('Not found'); return r.json(); });
    tdRenderQuote(q);
    await tdFetchHistory(sym, tdPer);
    tdEl('td-status').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    tdEl('td-status').textContent = 'Error: ' + e.message;
  }
}

function tdRenderQuote(q){
  tdEl('td-co-name').textContent = q.longName || q.shortName || q.symbol || '—';
  tdEl('td-co-sector').textContent = [q.sector, q.industry].filter(Boolean).join(' · ');
  tdEl('td-co-price').textContent = q.currentPrice != null ? '$' + q.currentPrice.toFixed(2) : '—';

  if (q.currentPrice != null && q.previousClose != null) {
    const chg = q.currentPrice - q.previousClose, pct = chg / q.previousClose * 100;
    const el = tdEl('td-co-chg');
    el.textContent = (chg >= 0 ? '▲ ' : '▼ ') + Math.abs(chg).toFixed(2) + ' (' + Math.abs(pct).toFixed(2) + '%)';
    el.style.color = chg >= 0 ? TC.green : TC.red;
  }

  const rows = [
    ['Open', q.open], ['Day Low', q.dayLow], ['Day High', q.dayHigh],
    ['52W Low', q.fiftyTwoWeekLow], ['52W High', q.fiftyTwoWeekHigh],
    ['Market Cap', q.marketCap ? (q.marketCap/1e9).toFixed(1) + 'B' : null],
  ];
  const cont = tdEl('td-stats'); cont.innerHTML = '';
  for (const [label, v] of rows) {
    const d = document.createElement('div'); d.className = 'td-stat-card';
    d.innerHTML = `<div class="l">${label}</div><div class="v">${v != null ? v : '—'}</div>`;
    cont.appendChild(d);
  }
}

async function tdFetchHistory(sym, period){
  const d = await fetch(`/api/trading/history/${sym}?period=${period}`).then(r => r.json());
  if (d.error || !d.close) return;
  const ctx = tdEl('td-mchart').getContext('2d');
  if (tdMChart) tdMChart.destroy();
  tdMChart = new Chart(ctx, tdBaseChart(d.close.labels, [
    { label: sym, data: d.close.values, borderColor: TC.accent, borderWidth:1.5, pointRadius:0 }
  ], 'Price ($)'));
}

async function tdRunBacktest(){
  if (!tdSym) { tdEl('td-status').textContent = 'Load a ticker first'; return; }
  const body = {
    symbol: tdSym,
    capital: parseFloat(tdEl('p-cap').value),
    sma_fast: parseInt(tdEl('p-fast').value),
    sma_slow: parseInt(tdEl('p-slow').value),
    stop_ma: parseInt(tdEl('p-stop').value),
    transaction_fee: parseFloat(tdEl('p-fee').value),
    dividend_yield: parseFloat(tdEl('p-div').value),
    period: tdEl('p-period').value,
  };
  const r = await fetch('/api/trading/backtest', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  }).then(r => r.json());
  if (r.error) { tdEl('td-status').textContent = 'Error: ' + r.error; return; }

  const ctx = tdEl('td-bchart').getContext('2d');
  if (tdBChart) tdBChart.destroy();
  tdBChart = new Chart(ctx, tdBaseChart(r.equity.labels, [
    { label:'Strategy', data:r.equity.values, borderColor: TC.accent, borderWidth:1.5, pointRadius:0 },
    { label:'Buy & Hold', data:r.bah.values, borderColor: TC.sub, borderWidth:1.5, pointRadius:0, borderDash:[4,4] },
  ], 'Portfolio Value ($)'));

  const s = r.stats;
  const rows = [
    ['Strategy Return', s.algo_return.toFixed(2) + '%'],
    ['Strategy Sharpe', s.algo_sharpe.toFixed(2)],
    ['Strategy Vol / DD', s.algo_volatility.toFixed(1) + '% / ' + s.algo_drawdown.toFixed(1) + '%'],
    ['Buy & Hold Return', s.bah_return.toFixed(2) + '%'],
    ['Buy & Hold Sharpe', s.bah_sharpe.toFixed(2)],
    ['B&H Vol / DD', s.bah_volatility.toFixed(1) + '% / ' + s.bah_drawdown.toFixed(1) + '%'],
    ['Total Trades', s.total_trades],
    ['Win Rate', s.win_rate.toFixed(1) + '%'],
  ];
  const cont = tdEl('td-bt-stats'); cont.innerHTML = '';
  for (const [label, v] of rows) {
    const d = document.createElement('div'); d.className = 'td-stat-card';
    d.innerHTML = `<div class="l">${label}</div><div class="v">${v}</div>`;
    cont.appendChild(d);
  }
}
</script>
{% endblock %}
